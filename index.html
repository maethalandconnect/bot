<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- กำหนด Permissions-Policy ให้หน้าหลักอนุญาตไมโครโฟนและเสียงอัตโนมัติ -->
    <meta http-equiv="Permissions-Policy" content="microphone=*, autoplay=*, camera=*">
    <title>AI ผู้ช่วยบริการประชาชน - สำนักงานที่ดินจังหวัดลำปาง สาขาแม่ทะ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #efeae2;
            font-family: sans-serif;
        }
        /* กรอบควบคุม iframe ให้แสดงผลเต็มจอและซ่อนแถบแบนเนอร์ Google ด้านบนอย่างพอดี */
        .iframe-wrapper {
            position: relative;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
        }
        .iframe-wrapper iframe {
            position: absolute;
            top: 0; /* หากมีแถบแจ้งเตือนของ Google ด้านบน ให้เปลี่ยนเป็น -28px */
            left: 0;
            width: 100%;
            height: 100%; /* หากปรับ top เป็น -28px ให้เปลี่ยนเป็น calc(100% + 28px) */
            border: none;
        }
    </style>
</head>
<body>

    <div class="iframe-wrapper">
        <iframe 
            id="maeThaBotFrame"
            src="https://script.google.com/macros/s/AKfycbx3r4JFR7VD4fn8vfDiLpBzOmzGh8f-Dg5jSm1mY3jD1P-rNGyht0w4E7GIDjldrfSlmg/exec?page=bot"
            allow="microphone *; autoplay *; camera *; clipboard-read *; clipboard-write *; encrypted-media *; fullscreen *"
            allowfullscreen>
        </iframe>
    </div>

    <script>
        // ขอสิทธิ์ไมโครโฟนที่ระดับหน้าเว็บหลัก (Top-Level GitHub Pages) ทันทีเมื่อผู้ใช้ต้องการใช้ไมค์
        // เพื่อปลดล็อกข้อจำกัดของ iOS Safari และ Android Chrome เมื่อรันผ่าน iframe
        window.addEventListener("message", async function(event) {
            if (event.data && event.data.action === "REQUEST_PARENT_MIC") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    stream.getTracks().forEach(t => t.stop());
                } catch (err) {
                    console.warn("Parent mic permission check:", err);
                }
            }
        });
    </script>
</body>
</html>
